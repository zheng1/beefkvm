name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Live-hardware tests are opt-in via IKVM_*_LIVE env vars and skip here.
      - name: Test
        run: go test -race ./...

  # The PC/SC backends are the only platform-specific code, so build them with
  # cgo enabled on the platforms that have a real implementation.
  smartcard-cgo:
    name: smart card cgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pcsclite (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev

      # Linux gates its pcsclite backend behind the `pcsc` tag so that a plain
      # `go build ./...` doesn't demand libpcsclite-dev; macOS needs no tag
      # because PC/SC ships with the OS.
      - name: Build with cgo
        env:
          CGO_ENABLED: "1"
          TAGS: ${{ runner.os == 'Linux' && '-tags=pcsc' || '' }}
        run: go build ${TAGS} ./...

      - name: Test vcard with cgo
        env:
          CGO_ENABLED: "1"
          TAGS: ${{ runner.os == 'Linux' && '-tags=pcsc' || '' }}
        run: go test ${TAGS} ./internal/vcard/ -v

  build-nocgo:
    name: nocgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here as much as Linux: the PC/SC backend is darwin-only
        # AND cgo-only, so "darwin without cgo" must still fall through to the
        # stub. A missing build constraint there once broke this exact case.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Everything except the smart-card backends is portable Go, so these
      # should all keep building. This job is what catches an accidental
      # unix-ism or a build constraint that leaves a platform with no backend.
      - name: Build all targets
        run: |
          set -euo pipefail
          targets="
            linux/amd64 linux/arm64 linux/arm linux/riscv64 linux/ppc64le linux/s390x
            darwin/amd64 darwin/arm64
            windows/amd64 windows/arm64 windows/386
            freebsd/amd64 freebsd/arm64
            openbsd/amd64 netbsd/amd64
          "
          fail=0
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            if GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build ./... 2>/tmp/err; then
              echo "  ok    $t"
            else
              echo "  FAIL  $t"; sed 's/^/        /' /tmp/err; fail=1
            fi
          done
          exit $fail
